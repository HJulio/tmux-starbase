# tmux-starbase. tmux holds the state and the UI; any plain terminal, local or over ssh, is just a
# view of it. Loaded from ~/.tmux.conf; put your own settings in ~/.config/starbase/local.conf.
# The workspaces are brought up by the `starbase` command.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g window-size latest
set -g aggressive-resize on

# launchd starts the server with a bare PATH; run-shell and the plugins need Homebrew (tmux, bash 5,
# nvim), on Apple Silicon or Intel
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# unnamed tabs take the directory of the focused pane, not the running command; while a sidebar
# (session tree or file tree) has the focus the name is kept, otherwise it would flip to the sidebar's directory
set -g automatic-rename-format "#{?#{||:#{==:#{pane_title},Sidebar},#{==:#{pane_current_command},nvim}},#{window_name},#{b:pane_current_path}}"

# --- status bar: one session per workspace, one window per tab ---
# Powerline look; needs a Nerd Font in the viewing terminal (MesloLGS NF in Ghostty).
# two rows: the bar, and a thin rule that separates it from the panes (cut to the window width)
set -g status 2
set -g status-format[1] "#[bg=default,fg=#34466a]────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────"
set -g status-position top
set -g status-interval 15
set -g status-style "bg=#16213a,fg=#a4b1cd"
# @ws_color is set per session by `starbase` from ~/.config/starbase/workspaces.sh; this is the fallback
set -g @ws_color "#45475a"
set -g status-left-length 40
set -g status-left "#[bg=#{@ws_color}]#[fg=#ffffff]#[bold]   #S #[nobold]#[fg=#{@ws_color}]#[bg=#16213a] "
set -g window-status-separator ""
# tab colors: blue number; name gray = quiet, yellow = new output, red with a bell = an agent
# finished or asks something (the bell is sent by claude/tmux-hook.py)
set -g monitor-activity on
set -g visual-activity off
# tmux reverses flagged tabs by default. Keep that for the bell (a solid red block is hard to miss)
# and drop it for plain activity, where the yellow name from the format below is enough.
set -g window-status-activity-style "default"
set -g window-status-bell-style "reverse"
set -g window-status-format " #[fg=#89b4fa]#I #[fg=#{?window_bell_flag,#ff6b6b,#{?window_activity_flag,#f9e2af,#a4b1cd}}]#W#{?window_bell_flag, ,}#{?window_zoomed_flag, ,} #[fg=#34466a]"
set -g window-status-current-format "#[fg=#16213a]#[bg=#9fef00]#[fg=#141d2b]#[bold] #I #W#{?window_zoomed_flag, ,} #[nobold]#[fg=#9fef00]#[bg=#16213a]"
# this tmux underlines the current tab by default; the highlighted block is enough
set -g window-status-current-style "bold"
set -g status-right-length 170
# On a narrow terminal segments fold down to their colored arrow, so you still see something is
# there: date and clock under 180 columns, the stats too under 140. Each terminal gets its own bar.
# segments, left to right: prefix flag, agents waiting in any workspace (red, only when there are
# some), menu hint (clickable), system stats, host (plus where this
# terminal connects from, when it is attached over ssh), date, clock
set -g status-right "#{?#{==:#{client_key_table},prefix},#[bg=#f9e2af]#[fg=#141d2b]#[bold] PREFIX #[default] ,}#{?#{S:#{W:#{?window_bell_flag,x,}}},#[fg=#ff6b6b]#[range=user|waiting]#[bg=#ff6b6b]#[fg=#141d2b]#[bold]  #{n:#{S:#{W:#{?window_bell_flag,x,}}}} #[nobold]#[range=right],}#[fg=#cba6f7]#[bg=#cba6f7]#[fg=#141d2b]   Ctrl-b menu #[fg=#22304d]#[bg=#22304d]#{?#{e|<:#{client_width},140}, , #(~/.tmux-starbase/bin/sysstat.sh) }#[fg=#89b4fa]#[bg=#89b4fa]#[fg=#141d2b]#[bold]   #h#(~/.tmux-starbase/bin/client-where.sh #{client_pid}) #[nobold]#[fg=#fab387]#[bg=#fab387]#{?#{e|<:#{client_width},180}, ,#[fg=#141d2b]   %a %d %b }#[fg=#9fef00]#[bg=#9fef00]#{?#{e|<:#{client_width},180}, ,#[fg=#141d2b]#[bold]   %H:%M }"

# --- keys without the prefix ---
# Option+1..9: tab N of this workspace. Option+Shift+Left/Right: previous/next tab
# (plain Option+arrows stays free for word jumps in the shell).
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-S-Left previous-window
bind -n M-S-Right next-window

# --- theme ---
# prompts and messages replace the status bar, so they get a loud block of their own
set -g message-style "bg=#f9e2af,fg=#141d2b,bold"
set -g message-command-style "bg=#f9e2af,fg=#141d2b"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
# panes without the focus get a slightly darker background
set -g window-style "bg=#0f1723"
set -g window-active-style "bg=default"
set -g menu-style "bg=#1e1e2e,fg=#cdd6f4"
set -g menu-selected-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g menu-border-style "bg=#1e1e2e,fg=#585b70"
set -g menu-border-lines rounded

# --- pane titles: folder and git branch on the top border of each pane ---
# Set before the session tree loads: the plugin wraps this format so its own panes keep their title.
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#89b4fa]#[bold],#[fg=#58688a]} #{b:pane_current_path}#(~/.tmux-starbase/bin/git-branch.sh '#{pane_current_path}') #[default]"

# --- left sidebar: session > window tree with agent badges ---
set -g @tmux_pane_tree_width 28
set -g @tmux_pane_tree_focus_on_open 0
# list sessions and windows only, plus panes running an agent
set -g @tmux_pane_tree_hide_panes on
# icons and badges: the Nerd Font must be in the terminal that views tmux (MesloLGS NF in Ghostty), not on this host
set -g @tmux_pane_tree_icon_theme nerdfont
set -g @tmux_pane_tree_color_session "#4da3ff"
set -g @tmux_pane_tree_color_window "#dfe5ee"
set -g @tmux_pane_tree_color_pane "#f9e2af"
source-file ~/.tmux-starbase/plugins/tmux-pane-tree/tmux-pane-tree.conf
# On arriving at a tab: if the focus was left on its tree (after clicking in it), put it back on the
# working pane, so you can type right away and the tree shows where you are instead of its own cursor.
# Then tell every tree to redraw now; on its own the plugin only catches up some seconds later.
set-hook -g "session-window-changed[250]" "if -F '#{==:#{pane_title},Sidebar}' { select-pane -l } ; run-shell -b '#{@tmux_sidebar_dir}/scripts/features/sidebar/on-pane-focus.sh #{pane_id} #{window_id}; #{@tmux_sidebar_dir}/scripts/features/sidebar/notify-sidebar.sh'"
set-hook -g "client-session-changed[250]" "if -F '#{==:#{pane_title},Sidebar}' { select-pane -l } ; run-shell -b '#{@tmux_sidebar_dir}/scripts/features/sidebar/on-pane-focus.sh #{pane_id} #{window_id}; #{@tmux_sidebar_dir}/scripts/features/sidebar/notify-sidebar.sh'"
# Keep the side panels at their width. tmux scales every pane when the terminal changes size and
# gives a closed pane's space to its neighbour, which squeezes the trees on a smaller screen.
set-hook -g "window-resized[250]" "run-shell -b '~/.tmux-starbase/bin/fix-widths.sh #{window_id}'"
set-hook -g "after-kill-pane[250]" "run-shell -b '~/.tmux-starbase/bin/fix-widths.sh #{window_id}'"

# --- right sidebar: file tree of the current pane's directory ---
set -g @treemux-tree-client 'nvim-tree'
set -g @treemux-tree-position 'right'
set -g @treemux-tree-width 44
# our wrapper: loads the plugin's treemux_init.lua, then adds the look and the editor
set -g @treemux-tree-nvim-init-file "$HOME/.config/nvim-starbase/init.lua"
# isolated nvim config/data (~/.config/nvim-starbase) so the tree never touches a personal nvim setup
set -g @treemux-nvim-command 'NVIM_APPNAME=nvim-starbase nvim'
# upstream default for this one is broken (expands to the option name)
set -g @treemux-refresh-interval-inactive-window 5
set -g @treemux-python-command '/usr/bin/python3'
run-shell ~/.tmux-starbase/plugins/treemux/sidebar.tmux

# --- save and restore: the live layout is saved every 5 minutes ---
# tmux-resurrect writes the snapshot, tmux-continuum triggers it (it hooks into status-right, so it
# must load after the status bar is defined). Restoring is done by `starbase`, and only when tmux starts
# empty; nothing is ever restored over a running layout. No program is relaunched on restore.
set -g @resurrect-dir '~/.local/state/starbase/snapshots'
set -g @resurrect-processes 'false'
set -g @continuum-save-interval '5'
# adds each tab's Claude conversation id to the snapshot
set -g @resurrect-hook-post-save-layout '~/.tmux-starbase/bin/save-claude-sessions.sh'
run-shell ~/.tmux-starbase/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux-starbase/plugins/tmux-continuum/continuum.tmux

# --- Ctrl-b opens a key menu instead of a silent prefix ---
# Every item keeps tmux's usual key, so "Ctrl-b c" still works from muscle memory.
# Ctrl-b twice gives the raw prefix table.
set -g prefix None
# clicking the right side of the status bar (the "Ctrl-b menu" hint) opens the same menu
bind -n MouseDown1StatusRight send-keys -K C-b
# (a user range must end with range=right, not norange, or the rest of the right side stops being clickable)
# three spots have their own click: the red counter jumps to a waiting agent, the container count
# lists the containers, the tailnet name opens the tailnet menu; any other click on the bar keeps tmux's default (select that tab)
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},waiting}' { run-shell '~/.tmux-starbase/bin/next-waiting.sh' } { if -F '#{==:#{mouse_status_range},tailnet}' { run-shell '~/.tmux-starbase/bin/tailnet-menu.sh #{client_name}' } { if -F '#{==:#{mouse_status_range},docker}' { run-shell '~/.tmux-starbase/bin/docker-menu.sh #{client_name}' } { switch-client -t = } } }
bind -n C-b display-menu -T "#[align=centre] tmux " -x C -y C \
  "Session tree (left)"   t   "run-shell -b '~/.tmux-starbase/bin/tree-toggle.sh'" \
  "Files (right)"         Tab "run-shell \"#{@tmux_sidebar_dir}/../treemux/scripts/toggle.sh '#{@treemux-key-Tab}' '#{pane_id}'\"" \
  "Next waiting agent"    a   "run-shell '~/.tmux-starbase/bin/next-waiting.sh'" \
  "Find tab"              f   "display-popup -E -w 60% -h 50% -T ' find tab ' '~/.tmux-starbase/bin/find-tab.sh'" \
  "Quick terminal"        Space "display-popup -E -w 80% -h 75% -d '#{pane_current_path}'" \
  "Git"                   g   "display-popup -E -w 92% -h 90% -d '#{pane_current_path}' lazygit" \
  "" \
  "New tab"               c   "new-window -c '#{pane_current_path}'" \
  "Next tab"              n   "next-window" \
  "Previous tab"          p   "previous-window" \
  "Rename tab"            ,   "command-prompt -p 'tab name:' -I '#W' \"rename-window -- '%%'\"" \
  "" \
  "Workspaces"            s   "choose-tree -Zs" \
  "New workspace"         N   "command-prompt -p 'workspace name:' \"new-session -s '%%'\"" \
  "Rename workspace"      $   "command-prompt -p 'workspace name:' -I '#S' \"rename-session -- '%%'\"" \
  "Move tab to workspace" .   "choose-tree -Zs \"move-window -t '%%'\"" \
  "" \
  "Split right"           %   "split-window -h -c '#{pane_current_path}'" \
  "Split down"            '"' "split-window -v -c '#{pane_current_path}'" \
  "Zoom pane"             z   "resize-pane -Z" \
  "Close pane"            x   "confirm-before -p 'kill pane? (y/n)' kill-pane" \
  "Scroll / copy mode"    [   "copy-mode" \
  "" \
  "Tailnet"               T   "run-shell '~/.tmux-starbase/bin/tailnet-menu.sh #{client_name}'" \
  "Containers"            D   "run-shell '~/.tmux-starbase/bin/docker-menu.sh #{client_name}'" \
  "Detach"                d   "detach-client" \
  "All keys"              ?   "list-keys -N" \
  "Raw prefix"            C-b "switch-client -T prefix"

# --- your settings: loaded last, so they win ---
source-file -q ~/.config/starbase/local.conf
