# Your own tmux settings. Loaded after starbase.conf, so anything here wins. A `git pull` of
# tmux-starbase never touches this file.

# Order of the workspaces in the session tree (the rest follow alphabetically)
# set -g @tmux_pane_tree_session_order "Home,Backend,Frontend"

# Width of the two side panels
# set -g @tmux_pane_tree_width 28
# set -g @treemux-tree-width 44

# Put the status bar at the bottom
# set -g status-position bottom

# No dimming of the panes without focus
# set -g window-style "bg=default"
